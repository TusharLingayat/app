name: Auto CI/CD Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: prod

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Set IMAGE TAG
      - name: Set Image Tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # 4. Build & Push Image
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/restorent-app:${{ steps.vars.outputs.IMAGE_TAG }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/restorent-app:${{ steps.vars.outputs.IMAGE_TAG }}

      # 5. Get container name dynamically from Kubernetes
      - name: Get Container Name
        id: cname
        run: |
          cname=$(kubectl get deployment restorent-app -o jsonpath='{.spec.template.spec.containers[0].name}')
          echo "CONTAINER_NAME=$cname" >> $GITHUB_OUTPUT

      # 6. Update Kubernetes Deployment with new image
      - name: Update Kubernetes Deployment Image
        run: |
          kubectl set image deployment/restorent-app \
          ${{ steps.cname.outputs.CONTAINER_NAME }}=${{ secrets.DOCKER_USERNAME }}/restorent-app:${{ steps.vars.outputs.IMAGE_TAG }} \
          --namespace default

      # 7. Verify rollout
      - name: Verify rollout
        run: kubectl rollout status deployment/restorent-app --namespace default

      # 8. Expose service if not exists
      - name: Expose Service (Only runs once)
        run: |
          if ! kubectl get service restorent-service --namespace default; then
            kubectl expose deployment restorent-app \
              --type=LoadBalancer \
              --port=80 \
              --target-port=8080 \
              --name=restorent-service \
              --namespace default
          fi
