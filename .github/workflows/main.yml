name: CI-CD Auto Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & Push image
      - name: Build & Push Docker Image
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/restorent
          TAG=$(date +%s)
          echo "TAG=${TAG}" >> $GITHUB_ENV

          docker build -t $IMAGE_NAME:$TAG .
          docker push $IMAGE_NAME:$TAG

      # Create kubeconfig
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

   

      # Update image in Deployment
      - name: Deploy to Kubernetes
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/restorent-app
          kubectl set image deployment/restorent-app restorent-app=$IMAGE_NAME:${TAG}

      # Verify Deployment
      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/restorent-app
          kubectl get pods -o wide
          kubectl get svc restorent-service -o wide
