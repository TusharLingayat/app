name: Build, Push, and Deploy to Kubernetes with Tag

on:
push:
branches:
- main

jobs:
build-push-deploy:
runs-on: self-hosted

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKER_USERNAME }}
      password: ${{ secrets.DOCKER_PASSWORD }}

  - name: Generate image tag
    id: tag
    run: echo "IMAGE_TAG=$(date +'%Y%m%d%H%M')-${GITHUB_SHA::7}" >> $GITHUB_ENV

  - name: Build and push Docker image
    uses: docker/build-push-action@v5
    with:
      context: .
      file: ./Dockerfile
      push: true
      tags: ${{ secrets.DOCKER_USERNAME }}/restorent:${{ env.IMAGE_TAG }}

  - name: Set up kubectl
    uses: azure/setup-kubectl@v3
    with:
      version: 'latest'

  - name: Configure Kubeconfig
    run: |
      echo "${{ secrets.KUBECONFIG_CONTENT }}" > kubeconfig
      export KUBECONFIG=$(pwd)/kubeconfig

  - name: Update Kubernetes deployment with new image
    run: |
      kubectl set image deployment/restorent-app \
        restorent-app=${{ secrets.DOCKER_USERNAME }}/restorent:${{ env.IMAGE_TAG }}
      kubectl rollout status deployment/restorent-app
```
