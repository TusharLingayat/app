name: Auto CI/CD Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: self-hosted     # your runner on EC2 that has kubectl + docker installed

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Set IMAGE TAG using latest commit SHA
      - name: Set Image Tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # 4. Build and Push Docker Image
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/restorent-app:${{ steps.vars.outputs.IMAGE_TAG }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/restorent-app:${{ steps.vars.outputs.IMAGE_TAG }}

      # 5. Update Image in Kubernetes Deployment
      - name: Update Kubernetes Deployment Image
        run: |
          kubectl set image deployment/restorent-app \
          restorent-app=${{ secrets.DOCKER_USERNAME }}/restorent-app:${{ steps.vars.outputs.IMAGE_TAG }} \
          --namespace default

      # 6. Verify Deployment rollout
      - name: Verify rollout
        run: kubectl rollout status deployment/restorent-app --namespace default

      # 7. (Optional) Expose service so it's accessible externally
      - name: Expose Service (Only runs once if not existing)
        run: |
          if ! kubectl get service restorent-service; then
            kubectl expose deployment restorent-app \
            --type=LoadBalancer \
            --port=80 \
            --target-port=8080 \
            --name=restorent-service
          fi
